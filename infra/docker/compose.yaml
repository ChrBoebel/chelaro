name: finance-os

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINANCE_OS_POSTGRES_DB:?set FINANCE_OS_POSTGRES_DB in .env}
      POSTGRES_USER: ${FINANCE_OS_POSTGRES_USER:?set FINANCE_OS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FINANCE_OS_POSTGRES_PASSWORD:?set FINANCE_OS_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    stop_grace_period: 30s

volumes:
  postgres_data:
