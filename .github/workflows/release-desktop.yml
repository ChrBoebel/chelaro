name: Release macOS Desktop
run-name: Release Chelaro ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish free macOS download
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.8.24
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Validate release configuration
        run: |
          test "$(uname -m)" = "arm64"
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --locked --all-groups
      - name: Verify release provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm release:check "$GITHUB_REF_NAME"
      - name: Verify release quality
        run: pnpm quality
      - name: Build ad-hoc signed installer
        run: pnpm package:desktop
      - name: Verify installer image and bundled version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          app_path="$PWD/apps/desktop/dist/mac-arm64/Chelaro.app"
          test "$(defaults read "$app_path/Contents/Info" CFBundleShortVersionString)" = "$version"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=2 "$app_path" 2>&1 | grep -F "Signature=adhoc"
          hdiutil verify "apps/desktop/dist/Chelaro-$version-arm64.dmg"
      - name: Create artifact checksums
        run: |
          cd apps/desktop/dist
          shasum -a 256 Chelaro-*.dmg > SHA256SUMS.txt
      - name: Preserve release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Chelaro-${{ github.ref_name }}-macOS-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release and update channel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/desktop/dist/*.dmg \
            apps/desktop/dist/SHA256SUMS.txt \
            --latest \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag \
            --title "Chelaro $GITHUB_REF_NAME"
