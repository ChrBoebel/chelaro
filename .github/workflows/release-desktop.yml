name: Release macOS Desktop
run-name: Release Chelaro ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    env:
      FINANCE_OS_SIGN_BUILD: "1"
      FINANCE_OS_UPDATE_URL: ${{ vars.FINANCE_OS_UPDATE_URL }}
      FINANCE_OS_UPDATE_BUCKET: ${{ vars.FINANCE_OS_UPDATE_BUCKET }}
      FINANCE_OS_UPDATE_PREFIX: ${{ vars.FINANCE_OS_UPDATE_PREFIX }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.UPDATE_AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.8.24
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Validate release configuration
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          test "$(uname -m)" = "arm64"
          test -n "$FINANCE_OS_UPDATE_URL"
          test -n "$FINANCE_OS_UPDATE_BUCKET"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          case "$FINANCE_OS_UPDATE_URL" in https://*) ;; *) exit 1 ;; esac
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --locked --all-groups
      - name: Verify release provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm release:check -- "$GITHUB_REF_NAME"
      - name: Verify release quality
        run: pnpm quality
      - name: Build signed and notarized installer
        run: pnpm package:desktop
      - name: Verify Apple signatures and notarization
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/mac-arm64/Chelaro.app"
          spctl --assess --type execute --verbose=2 "apps/desktop/dist/mac-arm64/Chelaro.app"
          xcrun stapler validate "apps/desktop/dist/Chelaro-$version-arm64.dmg"
      - name: Create artifact checksums
        run: |
          cd apps/desktop/dist
          shasum -a 256 Chelaro-*.dmg Chelaro-*.zip latest-mac.yml > SHA256SUMS.txt
      - name: Preserve signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Chelaro-${{ github.ref_name }}-macOS-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish update channel
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/publish-desktop-update.sh
      - name: Publish GitHub release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/desktop/dist/*.dmg \
            apps/desktop/dist/*.zip \
            apps/desktop/dist/latest-mac.yml \
            apps/desktop/dist/SHA256SUMS.txt \
            --generate-notes \
            --verify-tag \
            --title "Chelaro $GITHUB_REF_NAME"
